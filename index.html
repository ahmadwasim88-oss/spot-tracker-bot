/* ===================== TRANSACTION SUMMARY PAGES =====================
   ONE renderer (sumView) draws every summary, ONE function (txnView) opens every summary and
   ONE builder (txnFoot) makes the bottom buttons. A transaction type is only a small entry in TX.
     Change how ALL summaries look         -> edit sumView (and the row helpers above it)
     Change what ONE transaction shows     -> edit its spec() in TX
     Change one transaction's buttons      -> edit its share / print / edit / more / extra / nw in TX
     Add another transaction summary       -> add a TX entry and a one-line xxxView wrapper below
   Row format used by sumView: [label, value, kind]   kind: 't' grand total · 'b' bold · 'r' green · 'd' red */

/* ---- small formatting helpers ---- */
const rup=v=>'₹'+money(v),
 sdt=(t,tm)=>new Date(t).toLocaleString('en-IN',tm?{dateStyle:'medium',timeStyle:'short'}:{dateStyle:'medium'}),
 pctOf=(v,base)=>base>0.004?' ('+(+(v/base*100).toFixed(1))+'%)':'',
 NA='<span class="m">Not available</span>';

/* ---- row builders shared by several transactions ---- */
/* taxable value, GST and round off on ONE line (as in the original summary) */
const taxLine=o=>['Taxable '+rup(o.tx)+(o.tax>0.004?(o.ig?' · IGST '+rup(o.tax):' · CGST '+rup(o.tax/2)+' · SGST '+rup(o.tax/2)):'')+(Math.abs(o.ro||0)>0.004?' · Round off '+(o.ro>0?'+':'−')+rup(Math.abs(o.ro)):''),''],
 balRows=L=>L&&(Math.abs(+L.pre||0)>0.005||Math.abs(+L.bal||0)>0.005)?[['Previous balance',balTxt(L.pre)],['New balance',balTxt(L.bal),'b']]:[],
 modeTxt=(pm,m)=>pm?pm.map(x=>esc(x.m)+' '+rup(x.a)).join(' + '):(m?esc(m):''),
 profitRow=(label,pr,tx)=>[label,rup(pr)+pctOf(pr,tx),'b'],
 /* discount / taxable / GST / (extra) / round off / total: used by bill, estimate, purchase and notes */
 totRows=o=>[
  ...(o.disc>0.004?[['Discount'+(o.dp||''),'−'+rup(o.disc),'r']]:[]),
   taxLine(o),...(o.mid||[]),
  ['Total'+(o.sfx||''),rup(o.total),'t']],
 /* item table shared by bill and estimate (line discount shown under the item) */
 saleItems=r=>({h:['Item','Qty','Rate','Amount'],rows:r.lines.map(l=>[
  esc(l.n)+(l.d>0?`<br><span class="m rcv">discount −${rup(l.d)}${dPct(l.d,lgross(l))}</span>`:''),
  qtxt(l),rateTxt(l),money(lgross(l))])});

/* ---- the renderer: every summary page is drawn here ----
   o = { void, fresh, info            banner text (cancelled / saved / note)
         type, no, t, tm, sub         header: title, number, date (tm = also show time), extra line
         party:[role,name,extra]      who the transaction is with
         hero:[label,amount,class]    big amount (receipts, vouchers)
         items:{h,rows}               item table
         tots, settle                 row lists: totals block, payment / balance block
         note, act                    small note, buttons html (Receive, Show QR, Pay supplier)
         priv:{title,rows,note}       owner-only panel, never printed or shared }                       */
function sumView(o){
 const rw=r=>{
   const k=r[2],c=k=='r'?'rcv':k=='d'?'due':'';
   return k=='t'
    ?`<div class="line sp"><b>${r[0]}</b><span class="tt">${r[1]}</span></div>`
    :`<div class="line sp" style="margin-top:3px"><span class="${c||(k=='b'?'':'m')}">${r[0]}</span><span class="${c}">${k=='b'?'<b>'+r[1]+'</b>':r[1]}</span></div>`},
  block=(rows,rule)=>rows&&rows.length?`<div style="margin-top:6px;${rule?'border-top:1px solid var(--line);padding-top:4px':''}">${rows.map(rw).join('')}</div>`:'',
  s=db.shop,
  n=o.items?o.items.rows.length:0,
  banner=o.void?`<div class="c bad">${o.void}</div>`
        :o.fresh?`<div class="c ok">✔ ${o.fresh}</div>`
        :o.info?`<div class="c">${o.info}</div>`:'',
  shop=`<div class="ctr"><b>${esc(s.name)}</b>${s.addr?`<div class="m">${esc(s.addr)}</div>`:''}${shopSt()?`<div class="m">GSTIN ${esc(s.gstin)}</div>`:''}</div>`,
  head=`<div class="line sp" style="margin:8px 0"><div><b>${o.type}${o.no?' '+esc(o.no):''}</b><div class="m">${sdt(o.t,o.tm)}${n?' · '+n+' item'+(n==1?'':'s'):''}</div>${o.sub?`<div class="m">${o.sub}</div>`:''}</div>${o.party?`<div class="rt"><span class="m">${o.party[0]}</span><b>${esc(o.party[1])}</b>${o.party[2]?`<span class="m">${esc(o.party[2])}</span>`:''}</div>`:''}</div>`,
  hero=o.hero?`<div class="m">${o.hero[0]}</div><div class="bal ${o.hero[2]||''}">${rup(o.hero[1])}</div>`:'',
  table=n?`<table class="tbl"><tr>${o.items.h.map(h=>`<th>${h}</th>`).join('')}</tr>${o.items.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`:'',
  priv=o.priv&&o.priv.rows&&o.priv.rows.length
   ?ownerBox(`${o.priv.title?`<div class="oh">${o.priv.title}</div>`:''}${ownerRows(o.priv.rows)}${o.priv.note?`<div class="m on">${o.priv.note}</div>`:''}`):'';
 return banner
  +`<div class="c">${shop}${head}${hero}${table}${block(o.tots)}${block(o.settle,1)}${o.note?`<div class="m" style="margin-top:6px">${o.note}</div>`:''}${o.act?`<div class="row rowt">${o.act}</div>`:''}</div>`
  +priv}

/* ---- owner-only panels ---- */
/* estimate: what it would earn (today's average cost) and how far the price can come down.
   Discount headroom uses the same minimum-margin rule as the bill discount check. */
function estPriv(e){
 const C=costing(),missing=[],mu=1/mk(mpP()),tx=e.total-(e.ro||0)-e.tax;
 let cost=0,sub=0,allowed=1,checked=0;
 e.lines.forEach(l=>{
  const i=db.items.find(x=>x.id==l.id),z=C.S[l.id],
   unit=z&&z.q>0.0001&&z.v>0?z.v/z.q:(i&&+i.cost>0?+i.cost:0),
   amt=lgross(l)-(l.d||0),need=i&&+i.cost>0&&l.q>0?l.q*pbase(i):0;
  if(unit>0)cost+=unit*l.q;else missing.push(l.n);
  sub+=amt;
  if(need>0){checked++;const f=amt>0?Math.max(0,Math.min(1,1-need*mu/amt)):0;if(f<allowed)allowed=f}});
 const max=checked?Math.floor((sub*allowed+1e-9)*100)/100:null,
  room=max==null?null:Math.max(0,Math.round((max-(e.bd||0))*100)/100);
 return{title:'Bargaining guide',
  rows:[
   missing.length?['Potential profit',NA,'b']:profitRow('Potential profit',tx-cost,tx),
   ['Extra discount you can give',room==null?NA:rup(room)+pctOf(room,e.total),'b'],
   ['Lowest total you can accept',room==null?NA:rup(Math.round(e.total-room))]],
  note:missing.length
   ?'No purchase cost saved for '+missing.slice(0,3).map(esc).join(', ')+(missing.length>3?' and '+(missing.length-3)+' more':'')+', so figures are incomplete.'
   :'Based on current average cost. Discount is held so every item keeps your minimum margin ('+mpP()+'%).'}}

function stOps(full){const put={},del={};let n=0;const fresh=ST.cols.every(c=>!ST.sigs[c].size);
 ST.cols.forEach(c=>{const a=db[c]||[],M=ST.sigs[c],quick=!ST.mut[c]&&!full;let found=0;a.forEach((r,i)=>{if(r.id==null)r.id=uid();const o=M.get(r.id);if(o)found++;
   if(quick&&o&&stSame(o,r))return;
   const j=JSON.stringify(r);if(!o||o.j!==j){if(o&&!ST.mut[c]&&stSame(o,r))ST.escaped++;const s=o?o.s:(fresh?(ST.desc[c]?a.length-i:i+1):++ST.top);ST.top=Math.max(ST.top,s);(put[c]=put[c]||[]).push({k:r.id,s,j,m:[r.u||0,!!r.void,r.vt||0]});n++}});
  if(found<M.size){const ids=new Set(a.map(r=>r.id));for(const [k,o] of M)if(!ids.has(k)){(del[c]=del[c]||[]).push(o.k);n++}}});
 const meta=JSON.stringify(Object.fromEntries(Object.entries(db).filter(([k])=>!ST.cols.includes(k))));
 return{put,del,n,meta:ST.msig!==meta?meta:null,commit(){ST.cols.forEach(c=>{(put[c]||[]).forEach(x=>ST.sigs[c].set(x.k,{k:x.k,s:x.s,j:x.j,u:x.m[0],v:x.m[1],t:x.m[2]}));(del[c]||[]).forEach(k=>ST.sigs[c].delete(k))});if(this.meta!==null)ST.msig=this.meta}}}
async function stFlush(){if(ST.busy){ST.dirty=1;return}ST.busy=1;
 try{do{ST.dirty=0;const full=ST.full||Date.now()-ST.lastFull>3e5;ST.full=0;const o=stOps(full);if(full)ST.lastFull=Date.now();if(!o.n&&o.meta===null)continue;const names=[...new Set([...Object.keys(o.put),...Object.keys(o.del)])];
   await stTx(['meta',...names],'readwrite',t=>{names.forEach(c=>{const s=t.objectStore(c);(o.put[c]||[]).forEach(x=>s.put(x));(o.del[c]||[]).forEach(k=>s.delete(k))});if(o.meta!==null)t.objectStore('meta').put({k:'db',j:o.meta})});o.commit();ST.warned=0;ST.tries=0}while(ST.dirty)}
 catch(e){stFail(e);ST.tries=(ST.tries||0)+1;if(ST.tries<=6&&!ST.timer)ST.timer=setTimeout(()=>{ST.timer=0;stFlush()},Math.min(60000,3000*ST.tries*ST.tries))}finally{ST.busy=0}}
function stFullSoon(){if(ST.on&&!ST.vt)ST.vt=setTimeout(()=>{ST.vt=0;ST.full=1;stFlush()},4000)}
function stFail(e){if(!ST.warned){ST.warned=1;try{warn('Your latest changes could not be saved on this phone ('+((e&&e.name)||'storage error')+'). Download a backup now.')}catch(_){}}}
function lsave(){if(ST.on){stFlush();stFullSoon();return}try{localStorage.shopdb=JSON.stringify(db)}catch(e){alert('Storage full or blocked')}}
async function storeBoot(){try{if(!window.indexedDB)throw new Error('no indexedDB');ST.db=await stOpen();const d=await stLoad();
  if(d){db=stFill(d);ST.on=1}
  else{ST.on=1;stReset();await stFlush();const back=await stLoad();const same=back&&ST.cols.every(c=>(back[c]||[]).length===(db[c]||[]).length);
   if(!same){ST.on=0;throw new Error('migration check failed')}
   try{if(localStorage.shopdb){localStorage.shopdb_old=localStorage.shopdb;localStorage.shopdb_mig=String(Date.now());localStorage.removeItem('shopdb')}}catch(e){}}
  try{const m=+localStorage.shopdb_mig;if(m&&Date.now()-m>14*864e5){localStorage.removeItem('shopdb_old');localStorage.removeItem('shopdb_mig')}}catch(e){}
 }catch(e){ST.on=0}}
/* copies on this phone: one at the start of each day for a week, the last 3 from today (at least 2 hours apart), and one taken just before any restore.
   They let a mistake or a bug be undone with no internet. A small index in the "meta" store means a save never has to read the copies themselves. */
const snapQ=fn=>(ST.q=(ST.q||Promise.resolve()).then(fn,fn));
const snapPut=(k,text,label)=>ST.on?snapQ(async()=>{const t=Date.now(),list=[...(ST.snaps||[]).filter(x=>x.k!=k),{k,t,label:label||'',size:text.length}];await stTx(['snap','meta'],'readwrite',x=>{x.objectStore('snap').put({k,t,label:label||'',text});x.objectStore('meta').put({k:'snaps',j:JSON.stringify(list)})});ST.snaps=list}):Promise.resolve();
const snapDel=k=>snapQ(async()=>{const list=(ST.snaps||[]).filter(x=>x.k!=k);await stTx(['snap','meta'],'readwrite',x=>{x.objectStore('snap').delete(k);x.objectStore('meta').put({k:'snaps',j:JSON.stringify(list)})});ST.snaps=list});
const snapClear=()=>ST.on?snapQ(async()=>{await stTx(['snap','meta'],'readwrite',x=>{x.objectStore('snap').clear();x.objectStore('meta').delete('snaps')});ST.snaps=[]}).catch(()=>{}):Promise.resolve();
const snapGet=k=>{let r;return stTx(['snap'],'readonly',x=>{const q=x.objectStore('snap').get(k);q.onsuccess=()=>{r=q.result}}).then(()=>r)};
async function snapRun(){if(!ST.on)return;try{const now=Date.now(),k='d-'+dayStr(now),L=()=>ST.snaps||[];
  if(!L().some(x=>x.k==k))await snapPut(k,JSON.stringify(db),'daily');
  const rec=L().filter(x=>x.k.startsWith('r-')).sort((a,b)=>b.t-a.t);if(!rec.length||now-rec[0].t>72e5)await snapPut('r-'+now,JSON.stringify(db),'recent');
  try{localStorage.sb_lastsnap=String(now)}catch(e){}
  const d=L().filter(x=>x.k.startsWith('d-')).sort((a,b)=>b.k<a.k?-1:1),r=L().filter(x=>x.k.startsWith('r-')).sort((a,b)=>b.t-a.t),p=L().filter(x=>x.k.startsWith('pre-')).sort((a,b)=>b.t-a.t);
  for(const x of[...d.slice(ST.snapKeep),...r.slice(3),...p.slice(3)])await snapDel(x.k)}catch(e){}}
const snapSoon=()=>{if(!ST.on)return;const n=Date.now();if(n-(ST.snapRun||0)<6e5)return;ST.snapRun=n;snapRun()};
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const snapName=x=>x.label=='daily'?dtf(dayStr(x.t)):(x.label=='recent'?'Earlier today':'Before a restore')+' · '+new Date(x.t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
function snapPick(){const a=[...(ST.snaps||[])].sort((x,y)=>y.t-x.t);if(!a.length)return warn('No copies are saved on this phone yet');sheet('Copies on this phone',a.map(x=>['down',snapName(x)+' · '+kb(x.size),`snapAsk('${x.k}')`]))}
const snapAsk=k=>sheet('Restore this copy',[['down','Replace everything on this phone',`snapApply('${k}',0)`],['plus','Merge into the data on this phone',`snapApply('${k}',1)`]]);
async function snapApply(k,mode){try{const a=await snapGet(k);if(!a)return warn('That copy is no longer there');let d;try{d=JSON.parse(a.text);if(!Array.isArray(d.items))throw 0}catch(e){return warn('Could not read that copy')}
  try{await snapPut('pre-'+Date.now(),JSON.stringify(db),'before restore')}catch(e){}
  if(mode){const cur=db;db=norm(d);migrate();const x=db;db=cur;x.rst=db.rst;x.tomb={};db=merge(db,x)}else{db=stFill(norm(d));migrate()}
  migrate3();recalc();save();render();pgRefresh();toast(mode?'Copy merged':'Copy restored')}catch(e){warn('Could not restore that copy')}}
const bkHide=()=>{try{localStorage.sb_hide=String(Date.now()+7*864e5)}catch(e){}render()};
function bkBanner(){if(sc.repo||db.bills.length<10)return'';try{if((+localStorage.sb_hide||0)>Date.now())return''}catch(e){}if(db.lastBackup&&Date.now()-db.lastBackup<14*864e5)return'';
 return `<div class="c"><b>Back up your data</b><div class="m">${db.lastBackup?'Your last backup was '+Math.round((Date.now()-db.lastBackup)/864e5)+' days ago.':'You have not downloaded a backup yet.'} Right now your data is on this phone and its daily copies. Download a backup or set up sync.</div><div class="row rowt"><button class="btn" onclick="backup()">Download backup</button><button class="btn o" onclick="bkHide()">Later</button></div></div>`}
function bkStatus(){let ls=0;try{ls=+localStorage.sb_lastsnap||0}catch(e){}const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'},s=db.shop;
 return `<div class="c"><div class="m"><b>On this phone</b> · automatic<br>${ST.on?'One copy a day for the last '+ST.snapKeep+' days, plus the last few hours'+(ls?' · last made '+ago(ls):''):'Not available in this browser.'} These are lost if the phone is lost or the browser data is cleared.</div><div class="m" style="margin-top:8px"><b>GitHub sync</b> · automatic<br>${sc.repo?'On. Your data is also saved there as you work.':'Off. Turn it on under Sync between devices to keep a copy outside this phone.'}</div><div class="m" style="margin-top:8px"><b>Backup file</b> · you do this<br>${db.lastBackup?'Last downloaded '+ago(db.lastBackup):'Never downloaded.'} Keep the file in Drive. Do it every week.</div></div>`}
function bkPanel(){const s=db.shop;return `<div id="bkst">${bkStatus()}</div>
 <div class="row"><button class="btn" onclick="backup()">Download backup file</button></div>
 <div class="row"><button class="btn o" onclick="pickFile()">Restore from a file</button><button class="btn o" onclick="snapPick()">Restore from a copy on this phone</button></div><input id="rst" type="file" hidden onchange="restore(this.files[0])" oncancel="picking=0">
 <div class="c bad" style="margin-top:12px"><b>Erase</b>${fld('PIN needed to erase data',`<input type="password" inputmode="numeric" value="${esc(s.pin||'')}" placeholder="Default 4787: change it" oninput="sset('pin',this.value)">`)}<div class="row"><button class="btn r" onclick="resetAll()">Reset all data</button></div></div>`}
storeBoot().then(()=>{migrate();migrate3();migrate4();recalc();if(ST.on){ST.full=1;stFlush()}const wasSet=uiRestore();render();if(wasSet)openSettings();const route=new URL(location.href).searchParams.get('sbtx');if(route&&!openTransactionBarcode(route))warn('This transaction is not on this device yet. Sync or restore the data first.');syncNow();snapSoon();try{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&ST.on){ST.full=1;stFlush()}})}catch(e){}});
</script></body></html>
